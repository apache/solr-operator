# Dependabot owns GitHub Actions, and nothing else in this repository.
#
# There is deliberately no "gomod" entry here. Dependabot only runs the
# ecosystems listed in this file, so leaving it out is the enforcement.
# Go modules, the Makefile's pinned tool versions, the envtest assets and
# the hand-maintained image pins are upgraded in one reviewed sweep by the
# dependency-upgrade skill (.agents/skills/dependency-upgrade/SKILL.md),
# because each bump also needs the CRDs regenerated, dependency_licenses.csv
# refreshed, test fixtures repaired and an artifacthub.io/changes entry
# written - none of which Dependabot can do. Run "make list-upgrades" to see
# what has moved. Please do not add a gomod ecosystem here.
#
# There is no "docker" entry either. The only Dockerfile pins the Go builder
# image, which has to move in lockstep with the "go" directive in go.mod and
# the CI matrix, so it belongs to the same sweep.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    # Keep brand-new releases out until they have had a week to settle. This
    # applies to version updates only; security updates are never delayed.
    # The github-actions ecosystem supports default-days only - the
    # semver-major-days / semver-minor-days / semver-patch-days variants are
    # not honoured here, so do not add them.
    cooldown:
      default-days: 7
    # One PR for all actions rather than one per action.
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    # Review note: the ASF allowlists third-party actions by commit SHA, in
    # actions.yml in the apache/infrastructure-actions repository. A SHA that
    # is not on that list fails the workflow at startup, before any step runs,
    # so check a proposed SHA there before merging. Of the actions used here
    # only azure/setup-helm is third-party; the actions/* ones are first-party
    # and not gated. See the comment in publish-helm-oci.yaml.
