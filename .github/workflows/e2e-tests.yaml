name: E2E / Integration Tests

# The full e2e suite is too heavy for GitHub-hosted runners (4 vCPU / 16 GB for public repos), so pull
# requests run the reduced "pr" profile: the specs labelled Label("pr") in tests/e2e, one cheap and
# representative spec per feature area. See dev-docs/e2e-testing.md#continuous-integration.
#
# The job only runs for pull requests that change something the e2e suite actually exercises: the
# operator code and its image, the CRDs and dependencies installed into the cluster, the solr-operator
# Helm chart used to deploy it, and the e2e harness itself. Docs, examples, release tooling and the
# "solr" Helm chart (not used by the suite) do not trigger it.
on:
  pull_request:
    branches:
      - 'main'
      - 'release-*'
    paths:
      - 'api/**'
      - 'controllers/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'build/**'
      - 'config/crd/**'
      - 'config/dependencies/**'
      - 'helm/solr-operator/**'
      - 'tests/e2e/**'
      - 'tests/scripts/**'
      - 'Makefile'
      - '.github/workflows/e2e-tests.yaml'
  # Manual runs, e.g. for the full suite or another Solr/Kubernetes version.
  workflow_dispatch:
    inputs:
      test-labels:
        description: 'Ginkgo label filter (TEST_LABELS). Leave empty to run the full suite.'
        type: string
        default: 'pr'
      solr-version:
        description: 'Single Solr image tag to test with (SOLR_IMAGE=solr:<tag>). Leave empty to test every version a pull request tests.'
        type: string
        default: '9.11.0'
      kube-version:
        description: 'Kubernetes version for the KinD cluster (kindest/node tag)'
        type: string
        default: 'v1.33.7'

permissions:
  contents: read

# A new push to the same pull request supersedes the running job.
concurrency:
  group: e2e-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  e2eTests:
    name: Run E2E / Integration Tests

    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      # Both Solr versions are reported, a failure on one does not cancel the other.
      fail-fast: false
      matrix:
        go-version: [ '1.27' ]
        kube-version: [ "${{ inputs.kube-version || 'v1.33.7' }}" ]
        # Pull requests run the reduced profile against every supported Solr major version, so that
        # Solr 10 compatibility is covered. A manual run tests only the version given by the input.
        solr-version: ${{ fromJSON(inputs.solr-version && format('["{0}"]', inputs.solr-version) || '["9.11.0", "10.1.0"]') }}

    steps:
      # Setup
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - run: make clean

      - name: Cache dev dependencies
        id: cache-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: ${{ runner.os }}-code-dependencies-${{ matrix.go-version }}-${{ hashFiles('Makefile') }}

      - name: Install dev dependencies
        if: steps.cache-bin.outputs.cache-hit != 'true'
        run: make install-dependencies

      - name: Cache go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-modules-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-modules

      # Test
      - name: Run the e2e tests
        run: |
          # Pull requests always run the reduced profile. Manual runs use the given filter, where an
          # empty filter means the whole suite.
          TEST_LABELS="pr"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TEST_LABELS="${{ inputs.test-labels }}"
          fi
          make e2e-tests \
            SOLR_IMAGE="solr:${{ matrix.solr-version }}" \
            KUBERNETES_VERSION="${{ matrix.kube-version }}" \
            TEST_PARALLELISM=2 \
            TEST_LABELS="${TEST_LABELS}"

      # The suite writes pod logs, resource dumps and the operator log for every spec, plus junit.xml and
      # report.json, to tests/e2e/output. Keep them when something fails.
      - name: Upload e2e test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-output-solr-${{ matrix.solr-version }}-k8s-${{ matrix.kube-version }}
          path: tests/e2e/output/
          if-no-files-found: ignore
          retention-days: 14
