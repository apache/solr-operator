name: Helm OCI Index

# The Helm repository at https://solr.apache.org/charts is an index.yaml whose entries point at
# the OCI copies of the charts on ghcr.io. This tests that every Helm version we document can
# consume such an index, using hack/release/smoke_test/test_oci_index.sh.
#
# This is a separate workflow, rather than a job in smoke-tests.yaml, because that workflow
# ignores hack/release/upload/**, where the index generator lives.

on:
  pull_request:
    branches:
      - 'main'
      - 'release-*'
    paths:
      - '.github/workflows/helm-oci-index.yaml'
      - 'hack/release/smoke_test/test_oci_index.sh'
      - 'hack/release/upload/update_helm_index.sh'
      - 'helm/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Helm ${{ matrix.helm }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # 3.8 is the first release with OCI out of experimental; 4.3.1 is what
        # publish-helm-oci.yaml pins. Keep in sync with DEFAULT_HELM_VERSIONS in the script.
        helm: [ '3.8.2', '3.19.0', '4.3.1' ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      # The host Helm only packages and signs the charts. The Helm version under test runs in a
      # container, which the script downloads from get.helm.sh. This SHA must stay on the ASF
      # allowlist, see the note in publish-helm-oci.yaml.
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v4.3.1'

      - run: make yq
      - name: Test the OCI index with Helm ${{ matrix.helm }}
        run: ./hack/release/smoke_test/test_oci_index.sh -H "${{ matrix.helm }}"
