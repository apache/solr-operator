apiVersion: v2
name: solr-operator
description: The Solr Operator enables easy management of Solr resources within Kubernetes.
version: 0.10.0-prerelease
appVersion: v0.10.0-prerelease
kubeVersion: ">= 1.22.0-0"
home: https://solr.apache.org/operator
sources:
  - https://github.com/apache/solr-operator
keywords:
  - solr
  - apache
  - search
  - lucene
  - operator
maintainers:
  - name: Solr Dev Community
    email: dev@solr.apache.org
  - name: Houston Putman
    email: houston@apache.org
icon: https://solr.apache.org/theme/images/identity/Solr_Logo_on_white.png
dependencies:
  - name: 'zookeeper-operator'
    version: 0.2.15
    repository: https://charts.pravega.io
    condition: zookeeper-operator.install
annotations:
  artifacthub.io/category: "database"
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Full Lifecycle
  artifacthub.io/prerelease: "true"
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/apache-solr/solr
  artifacthub.io/links: |
    - name: "Tutorials"
      url: https://solr.apache.org/operator/resources#tutorials
  artifacthub.io/signKey: |
    fingerprint: <fingerprint>
    url: https://dist.apache.org/repos/dist/release/solr/KEYS
  # Add change log for a single release here.
  # Allowed syntax is described at: https://artifacthub.io/docs/topics/annotations/helm/#example
  # 'kind' accepts values: "added", "changed", "deprecated", "removed", "fixed" and "security"
  artifacthub.io/changes: |
    - kind: security
      description: The operator no longer runs a shell when creating the directory for a volume backup, so a SolrBackup `location` can no longer inject commands into the Solr pod
      links:
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/844
    - kind: removed
      description: The preStop hook running 'solr stop' has been removed from the Solr container, along with the SOLR_STOP_WAIT envVar that only served it. Solr shuts down on SIGTERM, so pod deletions no longer emit a FailedPreStopHook warning event
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/871
    - kind: added
      description: The operator can now resize (expand) persistent data PVCs, which requires new RBAC permissions for persistentvolumeclaims (update/patch) and storageclasses (get/list/watch)
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/709
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/712
    - kind: added
      description: The Solr Operator now creates events for Solr resources, giving users much more transparency on what is happening behind the scenes.
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/120
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/836
    - kind: changed
      description: A container PostStart Hook is no longer used to create the ZooKeeper ChRoot, instead the initContainer will manage this
      links:
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/774
    - kind: changed
      description: The default logging format is now `json`, and default log level is `info`.
      links:
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/779
    - kind: added
      description: Ability to configure `development` mode as well as log encoder, log level and stacktrace log level
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/778
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/779
    - kind: fixed
      description: A SolrBackup no longer gets stuck when the operator loses the status update recording that Solr accepted the backup, such as when the operator restarts at that moment
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/848
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/907
    - kind: fixed
      description: Fixed initContainer script that imports security.json
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/798
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/800
    - kind: fixed
      description: SOLR_TOOL_OPTS is now set, allowing 'setup-zk' initContainer to obey ZK connection settings
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/717
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/804
    - kind: added
      description: Ability to set the `enableServiceLinks` field on pods. 
      links:
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/790
    - kind: fixed
      description: Correct the placement and syntax of the image.imagePullSecret in the Solr-Operator Helm chart
      links:
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/782
    - kind: added
      description: Ability to set a securityContext for the default initContainers
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/797
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/796
    - kind: added
      description: Add option for Pod SecurityContext in the Solr-Operator Helm chart
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/817
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/818
    - kind: added
      description: Support global.imagePullSecrets for pulling images from private registries, this is merged with image.imagePullSecret. Both accept plain strings in addition to objects
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/338
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/832
    - kind: added
      description: Ability to set SessionAffinity and SessionAffinityConfig for Services
      links:
        - name: GitHub Issue
          url: https://github.com/apache/solr-operator/issues/535
        - name: GitHub PR
          url: https://github.com/apache/solr-operator/pull/571
    - kind: security
      description: Upgraded golang.org/x/net, golang.org/x/text, github.com/moby/spdystream and github.com/gorilla/websocket, fixing ten reachable vulnerabilities, mostly HTTP/2 denial-of-service issues
      links:
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/838
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/865
    - kind: changed
      description: Upgraded Go dependencies and build tools, notably the Kubernetes libraries from 1.31 to 1.37, controller-runtime from 0.19 to 0.25 and the Go toolchain from 1.22 to 1.27. The CRDs gain the new optional pod fields from the Kubernetes 1.32 to 1.37 API types; no existing field, default or RBAC permission changed
      links:
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/823
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/838
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/865
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/908
    - kind: changed
      description: The default Solr version (`DefaultSolrVersion`) is now 9.11.0, up from 8.11, so newly created SolrClouds without an image tag start on a Solr version carrying several CVE fixes. Existing clusters are unaffected; the operator writes the resolved tag into the spec on first reconcile, so an operator upgrade never changes a running cluster's Solr version
      links:
        - name: Solr 9.11.0 Release Notes
          url: https://solr.apache.org/docs/9_11_0/changes/Changes.html
        - name: Solr Security News
          url: https://solr.apache.org/security-news.html
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/807
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/869
    - kind: fixed
      description: A SolrPrometheusExporter that references a SolrCloud in another namespace is now reconciled when that SolrCloud changes, instead of only when a SolrCloud of the same name in the exporter's own namespace changes
      links:
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/879
    - kind: changed
      description: The `solr.xml` is now mounted into the Solr home directory from the ConfigMap, via a subPath volumeMount, instead of being copied there by the `cp-solr-xml` initContainer. That initContainer is only created for `volume` backupRepositories now, renamed to `volume-prep`
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/161
    - kind: fixed
      description: A cluster operation (scale up/down, rolling update, replica balancing, PVC expansion) that fails, e.g. because Solr is temporarily unreachable, is now always retried instead of stalling the SolrCloud until something else triggers a reconcile
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/707
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/876
    - kind: added
      description: Ability to load environment variables into the Solr container from ConfigMaps or Secrets via `podOptions.envFrom`
      links:
        - name: GitHub Issue
          url: https://github.com/apache/solr-operator/issues/677
        - name: GitHub PR
          url: https://github.com/apache/solr-operator/pull/877
    - kind: added
      description: Solr pods now get the availability_zone system property, used by Solr's AffinityPlacementFactory, from the topology.kubernetes.io/zone label of their Kubernetes node. The label is copied onto pods by Kubernetes v1.35+, and the property is empty on older versions. Solr pods also get the spread_domain system property, set to the name of their Kubernetes node
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/556
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/892
    - kind: added
      description: Support for Solr 10. See the upgrade notes before upgrading a SolrCloud to Solr 10.
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/821
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/827
    - kind: changed
      description: The operator no longer reconciles a SolrPrometheusExporter that uses a Solr 10 image or refers to a Solr 10 SolrCloud, as Solr 10 removed the Prometheus exporter. It emits an UnsupportedSolrVersion Warning event instead.
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/820
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/827
    - kind: changed
      description: The SolrCloud image tag must start with the Solr version (e.g. `10.0.0`, `9.10` or `8.11`). SolrClouds with other tags, such as `latest`, are no longer reconciled; see the upgrade notes before upgrading the operator.
      links:
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/827
    - kind: added
      description: The Helm charts are now published as OCI artifacts to oci://ghcr.io/apache/solr-operator/helm, which needs no `helm repo add` and no credentials
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/813
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/814
    - kind: changed
      description: The Helm repository at https://solr.apache.org/charts now lists the OCI charts, so existing `helm repo add` setups and chart dependencies keep working. It requires Helm 3.8 or later
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/813
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/900
    - kind: fixed
      description: A collection backup that Solr has lost track of, whose async status is reported as `notfound`, is now submitted again instead of being waited on forever. Previously this left the SolrBackup in progress indefinitely, and stopped recurring backups from ever being scheduled again. The operator also no longer deletes a backup's async status in Solr until the backup's result has been saved, which is one way this could happen, and a failing collection no longer stops the other collections' backups from being checked
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/824
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/910
    - kind: fixed
      description: A SolrCloud that is being deleted no longer gets stuck when its providedConfigMap has already been removed, e.g. by Helm in the same uninstall
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/828
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/888
    - kind: security
      description: Solr and Prometheus exporter pods now satisfy the Kubernetes Pod Security Standards "restricted" profile by default. The operator sets a seccompProfile on the pod and runAsNonRoot, allowPrivilegeEscalation false and capabilities.drop ALL on every container it generates. podSecurityContext, containerSecurityContext and defaultInitContainerSecurityContext are now merged over these defaults field by field
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/873
        - name: Pod Security Standards
          url: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
    - kind: security
      description: The Solr Operator's own container now drops all capabilities and sets a seccompProfile, so the operator pod satisfies the "restricted" profile too
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/873
    - kind: added
      description: New `podOptions.omitDefaultIDs` option for SolrClouds and SolrPrometheusExporters, which leaves the default fsGroup and init container runAsUser out of the generated pods, for platforms that assign the user and group IDs from a namespace range, such as OpenShift
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/466
    - kind: changed
      description: Every initContainer the operator generates now runs with readOnlyRootFilesystem true. The new `podOptions.readOnlyRootFilesystem` option opts the Solr and Prometheus exporter containers in as well, mounting emptyDir volumes where they write
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/884
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/885
  artifacthub.io/images: |
    - name: solr-operator
      image: apache/solr-operator:v0.10.0-prerelease
  artifacthub.io/crds: |
    - kind: SolrCloud
      version: v1beta1
      name: solrcloud.solr.apache.org
      displayName: Solr Cloud
      description: A distributed Solr Cloud cluster
    - kind: SolrPrometheusExporter
      version: v1beta1
      name: solrprometheusexporter.solr.apache.org
      displayName: Solr Prometheus Exporter
      description: A Prometheus metrics exporter for Solr
    - kind: SolrBackup
      version: v1beta1
      name: solrbackup.solr.apache.org
      displayName: Solr Backup
      description: A backup mechanism for Solr
  artifacthub.io/crdsExamples: |
    - apiVersion: solr.apache.org/v1beta1
      kind: SolrCloud
      metadata:
        name: example
      spec:
        dataStorage:
          persistent:
            reclaimPolicy: Delete
            pvcTemplate:
              spec:
                resources:
                  requests:
                    storage: "20Gi"
        replicas: 3
        solrImage:
          tag: 9.11.0
        solrJavaMem: "-Xms4g -Xmx4g"
        customSolrKubeOptions:
          podOptions:
            resources:
              requests:
                memory: "6G"
        zookeeperRef:
          provided:
            replicas: 3
        solrOpts: "-Dsolr.autoSoftCommit.maxTime=10000"
        solrGCTune: "-XX:SurvivorRatio=4 -XX:TargetSurvivorRatio=90 -XX:MaxTenuringThreshold=8"
        backupRepositories:
          - name: default-gcs
            gcs:
              bucket: solr-gcs-backups
              gcsCredentialSecret: # Required unless deployed in GKE and using its "Workplace Identity" feature
                name: gcs-credentials
                key: "service-account-key.json"
              baseLocation: "/solrcloud/backups"
          - name: default-s3
            s3:
              region: us-west-2
              bucket: solr-s3-backups
              credentials:
                accessKeyIdSecret: # Optional
                  name: aws-secrets
                  key: access-key-id
                secretAccessKeySecret: # Optional
                  name: aws-secrets
                  key: secret-access-key
    - apiVersion: solr.apache.org/v1beta1
      kind: SolrPrometheusExporter
      metadata:
        name: example
      spec:
        solrReference:
          cloud:
            name: "example"
        numThreads: 4
        image:
          tag: 9.11.0
    - apiVersion: solr.apache.org/v1beta1
      kind: SolrBackup
      metadata:
        name: example
      spec:
        repositoryName: solr-gcs-backups
        solrCloud: example
        collections:
          - techproducts
          - books
        location: "/this/location"
  artifacthub.io/containsSecurityUpdates: "true"
