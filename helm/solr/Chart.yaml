apiVersion: v2
name: solr
description: A SolrCloud cluster running on Kubernetes via the Solr Operator
version: 0.10.0-prerelease
appVersion: 9.11.0
kubeVersion: ">= 1.22.0-0"
home: https://solr.apache.org
sources:
  - https://github.com/apache/solr
  - https://github.com/apache/solr-operator
keywords:
  - solr
  - apache
  - search
  - lucene
maintainers:
  - name: Solr Dev Community
    email: dev@solr.apache.org
  - name: Houston Putman
    email: houston@apache.org
icon: https://solr.apache.org/theme/images/identity/Solr_Logo_on_white.png
annotations:
  artifacthub.io/alternativeName: "solrcloud"
  artifacthub.io/category: "database"
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "true"
  # Add change log for a single release here.
  # Allowed syntax is described at: https://artifacthub.io/docs/topics/annotations/helm/#example
  artifacthub.io/changes: |
    - kind: added
      description: Allow resizing (expanding) of persistent data PVCs
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/709
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/712
    - kind: added
      description: volumeAttributesClassName key is now supported when using PVCs in the Solr Helm chart
      links:
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/811
    - kind: added
      description: global.imagePullSecrets and podOptions.imagePullSecrets now accept plain strings in addition to objects, and are merged correctly into the Solr pods
      links:
        - name: Github Issue
          url: https://github.com/apache/solr-operator/issues/338
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/832
    - kind: changed
      description: The SolrCloud CRD accepts the new optional pod fields from the Kubernetes 1.37 API types, settable via podOptions once the operator chart's CRDs are updated. No existing field or default changed
      links:
        - name: Github PR
          url: https://github.com/apache/solr-operator/pull/865
    - kind: changed
      description: The default Solr version is now 9.11.0, up from 9.10.0. Newly created SolrClouds that do not set `image.tag` start on 9.11.0; existing clusters keep the tag already written into their spec
      links:
        - name: Solr 9.11.0 Release Notes
          url: https://solr.apache.org/docs/9_11_0/changes/Changes.html
    - kind: security
      description: Solr 9.11.0 carries the fixes for CVE-2026-22022, CVE-2026-22444 and CVE-2025-66516, all of which affect Solr 9.10.0 and earlier. Existing SolrClouds are not upgraded automatically; set `image.tag` to 9.11.0 to pick the fixes up
      links:
        - name: Solr Security News
          url: https://solr.apache.org/security-news.html
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/apache-solr/solr-operator
  artifacthub.io/links: |
    - name: "Solr Source"
      url: https://github.com/apache/solr
    - name: "Helm Chart Source"
      url: https://github.com/apache/solr-operator
    - name: "Solr Documentation"
      url: https://solr.apache.org/guide/
    - name: "Solr on Kube Tutorials"
      url: https://solr.apache.org/operator/resources#tutorials
  artifacthub.io/images: |
    - name: solr
      image: solr:9.11.0
      whitelisted: true
  artifacthub.io/signKey: |
    fingerprint: <fingerprint>
    url: https://dist.apache.org/repos/dist/release/solr/KEYS
